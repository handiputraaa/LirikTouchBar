name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # macos-latest maps to arm64 runners, which are often capacity-constrained.
    # Intel runners are more available; the build script still produces a
    # universal binary by cross-compiling the other architecture.
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: ./scripts/release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LirikTouchBar
          path: LirikTouchBar-v*.zip
          if-no-files-found: error
