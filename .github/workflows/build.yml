name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: ./scripts/release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LirikTouchBar
          path: LirikTouchBar-v*.zip
          if-no-files-found: error
